# Push a tag like v1.0.1 → build redmine.mcpb and attach it to a GitHub Release.
# Users always download from: <repo>/releases/latest/download/redmine.mcpb
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack
      - uses: softprops/action-gh-release@v3
        with:
          files: redmine.mcpb
          generate_release_notes: true
